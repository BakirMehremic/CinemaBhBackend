services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinemabhdev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cinemabhdev" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/cinemabhdev
      DB_USER: postgres
      DB_PASSWORD: root
      FRONTEND_URL: http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../CinemaBhFrontend
      args:
        - VITE_API_URL=http://localhost:8081
    ports:
      - "80:80"
    depends_on:
      - backend
