spring.application.name=CinemaBh
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
# default if FRONTEND_URL is not set in environment variables
frontend.url=http://localhost:5173
spring.mvc.validation.fail-fast=false
application.security.jwt.secret-key=${SECRET_KEY}
application.security.jwt.expiration-ms=${JWT_EXPIRATION}
application.security.jwt.refresh-token-expiration-ms=${REFRESH_EXPIRATION}
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}
verification.expiration-minutes=${VERIFICATION_EXPIRATION_MIN}
verification.schedule-delete-minutes=${VERIFICATION_SCHEDULE_DELETE_MIN}