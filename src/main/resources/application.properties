spring.application.name=CinemaBh
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
frontend.url=${FRONTEND_URL:http://localhost:5173}
spring.mvc.validation.fail-fast=false
application.security.jwt.secret-key=${SECRET_KEY}
application.security.jwt.access-token-expiration=${JWT_EXPIRATION:15m}
application.security.jwt.refresh-token-expiration=${REFRESH_EXPIRATION:7d}
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}
verification.expiration=${VERIFICATION_EXPIRATION:15m}
verification.schedule-delete=${VERIFICATION_SCHEDULE_DELETE:10m}
app.cookies.secure=${COOKIE_SECURE:true}
app.security.reserved.names=${RESERVED_NAMES}
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MIN:30}
app.rate-limit.verification-resend-cooldown=${RATE_LIMIT_VERIFICATION_COOLDOWN:60s}
application.security.validation.urls.iana=${IANA_URL:https://data.iana.org/TLD/tlds-alpha-by-domain.txt}
application.security.validation.urls.disposable-email=${DISPOSABLE_EMAIL_URL:https://raw.githubusercontent.com/disposable-email-domains/disposable-email-domains/master/disposable_email_blocklist.conf}
application.security.validation.urls.pwned-api=${PWNED_API_URL:https://api.pwnedpasswords.com/range/}
application.rest-client.connection-timeout=${REST_CLIENT_CONNECTION_TIMEOUT:2000ms}
application.rest-client.read-timeout=${REST_CLIENT_READ_TIMEOUT:5000ms}
logging.file.name=logs/app.log
